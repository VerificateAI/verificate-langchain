[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verificate-langchain"
version = "0.1.0"
description = "A veto gate for AI-written code in LangChain / LangGraph — 17 reality gates + frontier review, with veto power. Free to try, no signup."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Verificate", email = "info@verificate.ai" }]
keywords = ["langchain", "langgraph", "mcp", "code-review", "hallucination", "guardrails", "ai-safety", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["langchain-mcp-adapters>=0.1.0"]

[project.urls]
Homepage = "https://verificate.ai/mcp"
Documentation = "https://github.com/Verificate-Dev/verificate-langchain#readme"
Source = "https://github.com/Verificate-Dev/verificate-langchain"

[tool.setuptools]
packages = ["verificate_langchain"]
